<div class="container">
  <div class="filters">
    <a class="button" (click)="filter = 'Heads'" >Heads</a>
    <a class="button" (click)="filter = 'Arms'">Arms</a>
    <a class="button" (click)="filter = 'Torsos'">Torsos</a>
    <a class="button" (click)="filter = 'Bases'">Bases</a>
    <a class="button" (click)="filter = ''">All</a>
  </div>

  <ul class="products">
    <li class="product-item" *ngFor="let product of getFilteredProducts()">
      <div class="product" >
        <div class="product-details">
          <!-- <img src="{{product.imageName}}" alt="{{product.name}}" /> -->
          <!-- <img src="{{'./assets/images/robot-parts/' + product.imageName}}" alt="{{product.name}}" /> -->
          <!-- <img [src]="'/assets/images/robot-parts/' + product.imageName" [alt]="product.name" /> -->
          <img [src]="getImageUrl(product)" [alt]="product?.name" [title]="product?.name" />
          <div class="product-info">
            <div class="name">{{product?.name}}</div>
            <div class="description">{{product?.description}}</div>
            <div class="category">Part Type: {{product?.category}}</div>
          </div>
        </div>
        <div class="price">            
          <!-- <div>{{product.price | currency}}</div> -->
          <!-- <div>${{product?.price.toFixed(2)}}</div> -->
          <!-- <div *ngIf="product?.discount === 0">${{product?.price.toFixed(2)}}</div> -->
          <!-- <div [hidden]="product?.discount > 0">${{product?.price.toFixed(2)}}</div> -->
          <!-- <div [hidden]="product?.discount > 0">{{product?.price | currency:"USD"}}</div> -->
          <!-- <div [class.strikethrough]="product?.discount > 0">{{product?.price | currency:"USD"}}</div> -->
          <!-- <div [ngClass]="{'strikethrough': product?.discount > 0}">{{product?.price | currency:"USD"}}</div> -->
          <div class="discPrice"       
            [ngStyle]="{'color': product.discount > 0 ? 'red' : ''}"
            [ngClass]="getDiscountedClasses(product)">
            {{product?.price | currency:"USD"}}
          </div>
          <!-- <div [hidden]="product?.discount > 0">{{product?.price | currency:"USD"}}</div> -->
          <div class="discount" *ngIf="product?.discount > 0">
            <!-- <div>Discount: {{product.discount | percent}}</div> -->
            <!-- <div>Discount: <br>{{(product?.price * (1 - product?.discount)) | currency:"USD"}}</div> -->
            <div>{{(product?.price * (1 - product?.discount)) | currency:"USD"}}</div>
          </div>
          <button class="cta" (click)="addToCart(product)">Buy</button>
        </div>
      </div>
    </li>
  </ul>
</div>
